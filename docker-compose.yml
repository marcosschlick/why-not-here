services:
  db:
    image: postgres:18
    container_name: tcc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: tcc_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - ADMIN_EXPORT_KEY=${ADMIN_EXPORT_KEY:-}
    volumes:
      - ./src:/app/src
      - ./web/api:/app/web/api
      - ./maps:/app/maps
      - ./output:/app/output
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  participant_backend:
    build: .
    container_name: tcc_participant_backend
    command: ["uvicorn", "web.api.public_app:app", "--host", "0.0.0.0", "--port", "8001", "--no-proxy-headers", "--reload"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:?DB_NAME is required}
    volumes:
      - ./src:/app/src:ro
      - ./web/api:/app/web/api:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./web/frontend
    container_name: tcc_frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_PUBLIC_BASE_URL=${PUBLIC_PARTICIPANT_URL:-}
    volumes:
      - ./web/frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - backend

  participant_frontend:
    build: ./web/frontend
    container_name: tcc_participant_frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "5174:5174"
    environment:
      - VITE_BACKEND_URL=http://participant_backend:8001
      - VITE_PUBLIC_ONLY=true
      - VITE_PUBLIC_BASE_URL=${PUBLIC_PARTICIPANT_URL:-}
    volumes:
      - ./web/frontend/src:/app/src:ro
      - /app/node_modules
    depends_on:
      - participant_backend

volumes:
  postgres_data:
