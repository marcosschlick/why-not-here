services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-why_not_here}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-why_not_here_local_password}
      POSTGRES_DB: ${DB_NAME:-why_not_here}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: marcosschlick/why-not-here-backend:latest
    command: ["uvicorn", "web.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-why_not_here}
      DB_PASSWORD: ${DB_PASSWORD:-why_not_here_local_password}
      DB_NAME: ${DB_NAME:-why_not_here}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - results:/app/results
      - configurations:/app/configurations
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  participant_backend:
    image: marcosschlick/why-not-here-backend:latest
    command: ["uvicorn", "web.api.public_app:app", "--host", "0.0.0.0", "--port", "8001", "--no-proxy-headers"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-why_not_here}
      DB_PASSWORD: ${DB_PASSWORD:-why_not_here_local_password}
      DB_NAME: ${DB_NAME:-why_not_here}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: marcosschlick/why-not-here-frontend:latest
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_BACKEND_URL: http://backend:8000
      VITE_PUBLIC_BASE_URL: ${PUBLIC_PARTICIPANT_URL:-http://localhost:5174}
    depends_on:
      backend:
        condition: service_healthy

  participant_frontend:
    image: marcosschlick/why-not-here-frontend:latest
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "${PARTICIPANT_PORT:-5174}:5174"
    environment:
      VITE_BACKEND_URL: http://participant_backend:8001
      VITE_PUBLIC_ONLY: "true"
      VITE_PUBLIC_BASE_URL: ${PUBLIC_PARTICIPANT_URL:-http://localhost:5174}
    depends_on:
      - participant_backend

volumes:
  postgres_data:
  results:
  configurations:
